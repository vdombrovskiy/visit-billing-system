services:
  db:
    image: postgres:16-alpine
    container_name: visit-billing-db
    environment:
      POSTGRES_DB: visit_billing
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d visit_billing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
